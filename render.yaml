services:
  - type: web
    name: sjms-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: "sjms"
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        sync: false
      - key: METALS_DEV_API_KEY
        sync: false
